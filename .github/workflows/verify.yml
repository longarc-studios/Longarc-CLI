name: verify-public-boundary

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  macos-public-boundary:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify scripts and archive defenses
        run: /bin/sh scripts/test.sh
